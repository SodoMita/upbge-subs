# yaml-language-server=$schema=./newton.schema.json
# Newton's Laws - a physics example story for the Typewriter Subtitles
# engine. Same vocabulary as story.yml (sets of anims from t=0), but the
# "actors" here include real Bullet rigid bodies: every demonstration is
# triggered by a kinematic rig action (`action:`), and the moving bodies
# themselves carry NO action at all - physics plays them.
#
# The tour is deliberately LINEAR (goto chain, ends in stop): a physics
# rig is a one-shot performance (the puck has slid, the balls have
# rolled, the ball has bounced), so re-entering a set inside one session
# would narrate an empty stage. Press R in the game to reload the scene
# and run the lab again from rest.
start: intro
cps: 26
sets:
  intro:
    anims:
      - subs: newton_intro.srt#1-3
      - camera: NewtonWide
      - action: CubyRoot@newton__cuby
      - action: SpheroRoot@newton__sphero
    end: goto law1
  law1:
    anims:
      - subs: newton_law1.srt#1-4
      - camera: Law1
      - action: IcePusher@law1__pusher
      - action: CubyMouth@law1__cubymouth
      - action: SpheroMouth@law1__spheromouth
    end: goto law2
  law2:
    anims:
      - subs: newton_law2.srt#1-4
      - camera: Law2
      - action: Hammer@law2__hammer
      - action: CubyMouth@law2__cubymouth
      - action: SpheroMouth@law2__spheromouth
    end: goto law3
  law3:
    anims:
      - subs: newton_law3.srt#1-4
      - camera: Law3
      - action: TrapDoor@law3__door
      - action: CubyMouth@law3__cubymouth
      - action: SpheroMouth@law3__spheromouth
    end: goto outro
  outro:
    anims:
      - subs: newton_outro.srt#1-2
      - camera: NewtonWide
      - action: CubyRoot@newton__cuby
      - action: SpheroRoot@newton__sphero
    end: stop
